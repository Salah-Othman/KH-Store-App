name: kh_store_app
description: "KH Store - Fashion Ecommerce App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_storage: ^13.4.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2


dev_dependencies:

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
